# Dibs on Render. This one file tells Render what to make:
#
#   dibs        the site, always on
#   dibs-db     its database (Postgres)
#   dibs-tick   a timer that runs the checks once a minute
#
# A fourth part, background tasks for the slow checks, is kept ready in
# render-with-background-tasks.yaml and is added after the first deploy works.
#
# How to use it is in docs/GOING-ONLINE.md. No key or password is written
# here: where a line says "sync: false", Render asks you for the value once,
# when you first make the services. Every part is in one region so they can
# reach each other over Render's own network.

databases:
  - name: dibs-db
    plan: 0.1c-256mb # the smallest paid size. "free" also works, but Render deletes a free database 30 days after it is made.
    region: singapore
    # No "ipAllowList" line: the database can be reached from outside Render with its
    # password, over an encrypted link. The filming reset and the click attack need
    # that from the laptop (GOING-ONLINE.md, "Only for filming").

services:
  # ------------------------------------------------------------------ the site
  - type: web
    name: dibs
    runtime: node
    plan: 0.5c-512mb # always on. A free one sleeps after 15 minutes and takes about a minute to wake.
    region: singapore
    # devDependencies are needed too: they hold TypeScript (to build) and tsx (to run the scripts).
    buildCommand: npm install --include=dev && npm run build
    # Before each new version starts: create or update the tables, and load the
    # sample jobs if the database has never had anyone in it. It never wipes anything.
    preDeployCommand: npm run online:setup
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: dibs-uploads # recordings and files that workers hand in; kept across new builds
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dibs-db
          property: connectionString
      - key: DIBS_FILES_DIR
        value: /var/data/hand-ins
      - key: TICK_SECRET # the password for /api/tick. Render makes one up; nobody needs to know it.
        generateValue: true
      - key: DIBS_BASE_URL # the site's own public address, filled in after the site exists (GOING-ONLINE.md)
        sync: false
      # PayPal, test mode
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_LOGIN_ON
        sync: false
      - key: PAYPAL_TEST_BUYER_EMAIL
        sync: false
      - key: PAYPAL_TEST_WORKER_EMAIL
        sync: false
      - key: PAYPAL_TEST_WORKER2_EMAIL
        sync: false
      # AI and the video site
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: a separate AI key for the ledger's "ask" box. Empty = it uses GOOGLE_AI_API_KEY.
      - key: LEDGER_AI_API_KEY
        sync: false
      # For handing the slow checks to Render's background tasks later
      # (render-with-background-tasks.yaml). Left empty, the timer does every check itself.
      - key: DIBS_CHECKS_ON_RENDER
        sync: false
      - key: RENDER_API_KEY
        sync: false

  # ------------------------------------------------------------------ the timer
  - type: cron
    name: dibs-tick
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    schedule: "* * * * *" # every minute. Only one run at a time: the next waits for the last to finish.
    # The timer holds no keys. It asks the site, over Render's own inside network,
    # to run the due checks and payments, and prints the answer. So nothing here
    # is copied from a box that may have been left empty.
    buildCommand: echo "nothing to build"
    startCommand: node scripts/tick-call.mjs
    envVars:
      - key: DIBS_WEB_HOSTPORT
        fromService:
          name: dibs
          type: web
          property: hostport
      - key: TICK_SECRET # the same made-up password the site has
        fromService:
          name: dibs
          type: web
          envVarKey: TICK_SECRET
