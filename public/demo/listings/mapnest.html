<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saffron Lane Café | MapNest</title>
<style>
  :root { --bg: #17181a; --card: #202225; --line: #303338; --text: #eceae4; --mute: #a2a39f; --accent: #7fa8e0; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  header { border-bottom: 1px solid var(--line); }
  .bar { max-width: 760px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
  .brand i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 10px; }
  .tag { color: var(--mute); font-size: 14px; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 48px; }
  .crumb { color: var(--mute); font-size: 14px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  .kind { display: inline-block; font-size: 13px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 3px 12px; margin-bottom: 14px; }
  h1 { font-size: 32px; line-height: 1.15; letter-spacing: -0.03em; overflow-wrap: anywhere; }
  dl { margin-top: 24px; display: grid; grid-template-columns: 140px 1fr; border-top: 1px solid var(--line); }
  dt, dd { padding: 14px 0; border-bottom: 1px solid var(--line); }
  dt { color: var(--mute); font-size: 14px; padding-top: 16px; }
  dd { font-weight: 600; overflow-wrap: anywhere; }
  .note { margin-top: 24px; color: var(--mute); font-size: 14px; }
  @media (max-width: 520px) {
    h1 { font-size: 26px; }
    .card { padding: 20px; }
    dl { grid-template-columns: 1fr; }
    dt { border-bottom: 0; padding-bottom: 0; }
    dd { padding-top: 4px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand"><i></i>MapNest</span>
    <span class="tag">Find it on the map, then find the door</span>
  </div>
</header>
<main>
  <p class="crumb">Pune / Cafés / Saffron Lane Café</p>
  <article class="card">
    <span class="kind">Café</span>
    <h1>Saffron Lane Café</h1>
    <dl>
      <dt>Name</dt>
      <dd>Saffron Lane Café</dd>
      <dt>Address</dt>
      <dd>14 Saffron Lane, Pune 411001</dd>
      <dt>Phone</dt>
      <dd>020 5550 4412</dd>
      <dt>Opening hours</dt>
      <dd>Open 8 am to 9 pm every day</dd>
    </dl>
  </article>
  <p class="note">Demo page with a made-up brand.</p>
</main>
</body>
</html>
